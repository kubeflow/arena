name: Labeler (v2)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Add label
        uses: actions/labeler@v7
        with:
          sync-labels: true
          # repo-token: ${{ secrets.GITHUB_TOKEN }}
