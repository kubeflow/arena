name: Integration Test (v2)

on:
  push:
    branches: [develop-v2]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  validate-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check VERSION isolation
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          if echo "${CHANGED_FILES}" | grep -q "^VERSION$"; then
            OTHER_FILES=$(echo "${CHANGED_FILES}" | grep -v "^VERSION$" || true)
            if [ -n "${OTHER_FILES}" ]; then
              echo "::error::VERSION must be changed in isolation. Also changed:"
              echo "${OTHER_FILES}"
              exit 1
            fi
          fi

  build-arena-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go mod tidy check
        run: |
          go mod tidy
          if ! git diff --quiet; then
            echo "Please run 'go mod tidy' to add missing and remove unused dependencies"
            exit 1
          fi

      - name: Run gofmt check
        run: |
          make v2-fmt
          if ! git diff --quiet; then
            echo "Please run 'make v2-fmt' to format the code"
            exit 1
          fi

      - name: Run go vet check
        run: |
          make v2-vet

      - name: Run golangci-lint
        run: |
          make v2-lint

      - name: Run Go unit tests
        run: |
          make v2-test

      - name: Build arena-v2 binary
        run: |
          make arena-v2
