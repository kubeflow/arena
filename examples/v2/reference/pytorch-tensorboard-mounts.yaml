# PyTorch job with TensorBoard mounts override
# Demonstrates how to selectively mount storages in the TensorBoard pod.
# All 3 storages become volumes, but only the "logs" storage is mounted
# in the TensorBoard container (at the overridden /tb/logs path).
# NOTE: Requires PVCs 'training-data-pvc', 'tensorboard-logs-pvc', 'model-cache-pvc'.
version: 0.1.0
name: pytorch-tensorboard-example
image: docker.io/pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
run: |
  pip install -q tensorboard && python -c "
  import torch, torch.nn as nn
  from torch.utils.tensorboard import SummaryWriter
  writer = SummaryWriter('/tb/logs')
  model = nn.Linear(10, 1)
  optimizer = torch.optim.SGD(model.parameters(), lr=0.01)
  for epoch in range(3):
      x, y = torch.randn(64, 10), torch.randn(64, 1)
      loss = nn.MSELoss()(model(x), y)
      optimizer.zero_grad(); loss.backward(); optimizer.step()
      writer.add_scalar('Loss/train', loss.item(), epoch)
      print(f'Epoch {epoch+1}/3 - loss: {loss.item():.4f}')
  writer.close()
  print('Training complete. TensorBoard logs written to /tb/logs')
  "
framework:
  name: pytorch
worker:
  replicas: 2
  resources:
    # nvidia.com/gpu: "1"  # GPU disabled for CPU testing
storages:
  - name: data
    pvc: training-data-pvc
    mount_path: /data
  - name: logs
    pvc: tensorboard-logs-pvc
    mount_path: /logs
  - name: cache
    pvc: model-cache-pvc
    mount_path: /cache
logging:
  tensorboard:
    enabled: true
    logdir: /tb/logs
    mounts:
      - name: logs
        mount_path: /tb/logs
